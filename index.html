
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MILLIONS</title>

<style>
:root {
  --background: #190008;
  --pink: #E8B3C7;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--background);
  color: var(--pink);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 14px;
}

a {
  color: var(--pink);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* TOP HEADER */

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 20px;
  border-bottom: 1px solid var(--pink);
}

.logo {
  font-size: 24px;
  font-weight: bold;
  letter-spacing: -1px;
}

nav {
  display: flex;
  gap: 22px;
  align-items: center;
}

/* IMAGE COLLECTION */

.archive {
  columns: 3 220px;
  column-gap: 30px;
  padding: 20px;
  min-height: 450px;
}

.photo {
  display: inline-block;
  width: 100%;
  margin: 0 0 30px;
  break-inside: avoid;
  position: relative;
}

.photo img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--pink);
  cursor: pointer;
}

.caption {
  font-size: 12px;
  margin-top: 5px;
  color: var(--pink);
}

/* IMAGE VIEWER */

.viewer {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(10, 0, 5, 0.95);
  justify-content: center;
  align-items: center;
  padding: 30px;
  cursor: pointer;
}

.viewer img {
  max-width: 95%;
  max-height: 90vh;
  object-fit: contain;
}

.viewer.active {
  display: flex;
}

/* FOOTER */

footer {
  border-top: 1px solid var(--pink);
  text-align: center;
  padding: 22px;
  min-height: 160px;
  line-height: 2;
  color: var(--pink);
}

@media (max-width: 600px) {
  .archive {
    columns: 2 140px;
    column-gap: 14px;
    padding: 12px;
  }

  header {
    padding: 15px 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">MILLIONS</div>

  <nav>
    <a href="#">ABOUT</a>
    <a href="#">♥</a>
  </nav>
</header>

<main class="archive" id="archive"></main>

<div class="viewer" id="viewer">
  <img id="viewerImage" src="" alt="">
</div>

<footer>
  IN CASE OF EMERGENCIES...
</footer>

<script>
const images = [
  { file: "image001.jpg", caption: "" },
  { file: "image002.jpg", caption: "" },
  { file: "image003.jpg", caption: "" }
];

const archive = document.getElementById("archive");

images.forEach(photo => {
  const item = document.createElement("div");
  item.className = "photo";

  const img = document.createElement("img");
  img.src = "images/" + photo.file;
  img.alt = "MILLIONS photograph";

  img.addEventListener("click", () => {
    document.getElementById("viewerImage").src = img.src;
    document.getElementById("viewer").classList.add("active");
  });

  item.appendChild(img);

  if (photo.caption) {
    const caption = document.createElement("div");
    caption.className = "caption";
    caption.textContent = photo.caption;
    item.appendChild(caption);
  }

  archive.appendChild(item);
});

document.getElementById("viewer").addEventListener("click", () => {
  document.getElementById("viewer").classList.remove("active");
});
</script>

</body>
</html>
